    <style>
        body { margin: 0; font-family: Helvetica, Arial, sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        #panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: rgba(255,255,255,0.94); border: 1px solid #555;
            border-radius: 6px; padding: 10px 14px; width: 260px;
            box-shadow: 0 2px 8px rgba(0,0,0,.3);
        }
        #panel h2 { margin: 0 0 4px 0; font-size: 15px; }
        #clock { font-size: 24px; font-weight: bold; margin: 2px 0; }
        #stats { font-size: 12px; color: #333; margin: 4px 0 10px 0; }
        input[type=range] { width: 100%; }
        .btn { display: inline-block; background: #1565c0; color: #fff; border: 0;
            padding: 6px 12px; border-radius: 4px; font-size: 13px; cursor: pointer; margin-top: 6px; }
        .legend { font-size: 11px; color: #444; margin-top: 8px; }
        .sw { display:inline-block; width:11px; height:11px; margin-right:4px; border:1px solid #999; }
        .leaflet-popup-content { user-select: text; font-size: 12.5px; line-height: 1.5; margin: 10px 14px; }
        em { font-size: 11px; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="panel">
        <h2>SA risk grid — 2016</h2>
        <div id="clock">17:00</div>
        <div id="stats"></div>
        <input id="hour" type="range" min="0" max="23" step="1" value="17" />
        <button class="btn" id="now">Jump to now</button>
        <div class="legend">
            <span class="sw" style="background:#f0f0f0"></span>0<br />
            <span class="sw" style="background:#ffffb2"></span>1-2 crashes<br />
            <span class="sw" style="background:#fecc5c"></span>3-5<br />
            <span class="sw" style="background:#fd8d3c"></span>6-10<br />
            <span class="sw" style="background:#e31a1c"></span>11-20<br />
            <span class="sw" style="background:#7b0000"></span>20+<br />
            <em>average crashes in this hour, 2016 &middot; click any cell for its full profile</em>
        </div>
    </div>

        var STEP = 0.008;

        function colorFor(v) {

            if (v <= 10) return '#fd8d3c';

            if (h === cur) return;

                rect.addTo(grid);

            document.getElementById('hour').value = h;

            for (var k in CELLS) {

                '<em>verdict: be careful here at ' + String(worst).padStart(2, '0') + ':00</em>';
        }
